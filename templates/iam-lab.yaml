AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS Lab 01 - Introduction to IAM. Creates three IAM users and three groups,
  attaches each group's policy, adds each user to its group, and creates an
  S3 bucket and an optional EC2 instance to test the permissions against.

Parameters:
  UserPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Console password for user-1, user-2 and user-3 (must meet the account's password policy).
  CreateTestInstance:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Launch a t3.micro instance so user-2 and user-3 have something to view and stop (it costs money while running).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI for the test instance (latest Amazon Linux 2023 by default).

Conditions:
  MakeInstance: !Equals [!Ref CreateTestInstance, "true"]

Resources:
  # ---------- Groups ----------
  S3SupportGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: S3-Support
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  EC2SupportGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2-Support
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess

  EC2AdminGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: EC2-Admin
      Policies:
        - PolicyName: EC2-Admin-Policy   # inline policy, same as policies/EC2-Admin-Policy.yaml
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:StartInstances
                  - ec2:StopInstances
                Resource: "*"

  # ---------- Users (Task 2: each user is placed in its group) ----------
  User1:
    Type: AWS::IAM::User
    Properties:
      UserName: user-1
      Groups: [!Ref S3SupportGroup]
      LoginProfile:
        Password: !Ref UserPassword
        PasswordResetRequired: false

  User2:
    Type: AWS::IAM::User
    Properties:
      UserName: user-2
      Groups: [!Ref EC2SupportGroup]
      LoginProfile:
        Password: !Ref UserPassword
        PasswordResetRequired: false

  User3:
    Type: AWS::IAM::User
    Properties:
      UserName: user-3
      Groups: [!Ref EC2AdminGroup]
      LoginProfile:
        Password: !Ref UserPassword
        PasswordResetRequired: false

  # ---------- Resources to test against ----------
  LabBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "iam-lab-s3bucket-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LabInstance:
    Type: AWS::EC2::Instance
    Condition: MakeInstance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      Tags:
        - Key: Name
          Value: iam-lab-instance

Outputs:
  SignInUrl:
    Description: IAM users sign-in URL (Task 3)
    Value: !Sub "https://${AWS::AccountId}.signin.aws.amazon.com/console"
  BucketName:
    Value: !Ref LabBucket
  InstanceId:
    Condition: MakeInstance
    Value: !Ref LabInstance
